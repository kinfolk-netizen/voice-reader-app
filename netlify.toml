# Netlify Configuration for Voice Reader App - Phase 2
# Timestamp: 2:48PM, 12.10.24

[build]
  # Publish directory - where static files are served from
  publish = "public"
  
  # Functions directory - serverless API endpoints
  functions = "api"
  
  # No build command needed (static site)
  command = ""

  # Credit saver (2026-10-06): on production, skip the deploy when a commit touches
  # nothing that ships (docs, CLAUDE.md, devtest). Exit 0 = skip, exit 1 = build.
  # Deploy Previews and branch deploys always build (they're free).
  ignore = "if [ \"$CONTEXT\" != \"production\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public/ api/ netlify.toml package.json"

# Function settings
[functions]
  # Node.js runtime
  node_bundler = "esbuild"
  
  # Include environment variables
  included_files = ["api/**"]

# Redirects for API routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# CORS headers for API endpoints
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Environment
[context.production.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Dev server settings
[dev]
  command = ""
  port = 8888
  targetPort = 8888
  publish = "public"
  functions = "api"
