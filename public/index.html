<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Reader - Sentence-Level Highlighting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #1f2937 0%, #020617 45%, #000 100%);
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 32px 16px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.12), transparent 55%) #020617;
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
            padding: 28px 26px 26px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            border-radius: 999px;
            background: linear-gradient(to right, rgba(96, 165, 250, 0.2), rgba(129, 140, 248, 0.2));
            border: 1px solid rgba(129, 140, 248, 0.6);
            color: #c7d2fe;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #4ade80;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .header h1 {
            font-size: 2.4em;
            margin-bottom: 6px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95em;
            color: #9ca3af;
        }

        .card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #60a5fa;
        }

        label {
            display: block;
            font-size: 0.9em;
            color: #9ca3af;
            margin-bottom: 8px;
            font-weight: 500;
        }

        select, textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.3), rgba(59, 130, 246, 0.3));
            border: 1px solid rgba(96, 165, 250, 0.5);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.5), rgba(59, 130, 246, 0.5));
            transform: scale(1.05);
        }

        .control-btn.primary {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        #status {
            text-align: center;
            font-size: 0.9em;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 999px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 8px;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            transition: width 0.1s linear;
        }

        .reader-display {
            background: radial-gradient(circle at top, rgba(15, 23, 42, 0.95), #020617);
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            padding: 18px;
            max-height: 450px;
            overflow-y: auto;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
            margin-top: 20px;
        }

        .reader-content {
            font-size: 1.05em;
            line-height: 1.8;
            color: #d1d5db;
        }

        .reader-content p {
            margin-bottom: 1em;
        }

        .reader-sentence {
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline;
            padding: 2px 0;
        }

        .reader-sentence:hover {
            background: rgba(96, 165, 250, 0.1);
            border-radius: 4px;
        }

        .reader-sentence.highlight {
            background: linear-gradient(120deg, rgba(96, 165, 250, 0.25) 0%, rgba(59, 130, 246, 0.2) 100%);
            padding: 4px 6px;
            border-radius: 6px;
            box-shadow: 0 0 16px rgba(96, 165, 250, 0.3);
            transition: all 0.3s ease;
        }

        .reader-display::-webkit-scrollbar {
            width: 8px;
        }

        .reader-display::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5);
            border-radius: 999px;
        }

        .reader-display::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.4);
            border-radius: 999px;
        }

        .status-msg {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
        }

        .status-msg.success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-msg.error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-msg.info {
            background: rgba(96, 165, 250, 0.1);
            color: #93c5fd;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .hidden {
            display: none;
        }

        .slider-group {
            margin-bottom: 15px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        input[type="range"] {
            width: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="badge">
                <span class="badge-dot"></span>
                <span>Sentence-Level Highlighting</span>
            </div>
            <h1>🎙️ Voice Reader</h1>
            <p>Multi-provider TTS with sentence highlighting and secure backend</p>
        </header>

        <div class="card">
            <div class="card-title">Settings</div>
            
            <label for="provider">TTS Provider</label>
            <select id="provider">
                <option value="local">Local Browser (Free + Real-time Highlighting)</option>
                <option value="openai">OpenAI TTS (Premium + Estimated Highlighting)</option>
                <option value="elevenlabs">ElevenLabs (Premium + Estimated Highlighting)</option>
            </select>

            <div id="local-settings">
                <label for="voice">Voice</label>
                <select id="voice">
                    <option value="">Loading voices...</option>
                </select>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Speed</span>
                        <span id="speed-value">1.0x</span>
                    </div>
                    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Pitch</span>
                        <span id="pitch-value">1.0</span>
                    </div>
                    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Text Input</div>
            <textarea id="text" placeholder="Paste your text here...">Welcome to Voice Reader with sentence-level highlighting! This works with all TTS providers. Click any sentence to jump to that position. The current sentence is highlighted during playback.</textarea>
            <button id="use-text-btn">Load Text</button>
        </div>

        <div class="card" id="player-card" style="display: none;">
            <div class="card-title">Playback</div>
            
            <div id="status">Ready to play</div>

            <div class="controls">
                <button class="control-btn" id="skip-back" title="Skip Back">⏪</button>
                <button class="control-btn primary" id="play-btn" title="Play">▶</button>
                <button class="control-btn" id="skip-forward" title="Skip Forward">⏩</button>
            </div>

            <div class="progress-bar" id="progress-bar">
                <div id="progress-fill"></div>
            </div>

            <div class="reader-display">
                <div class="reader-content" id="reader-content"></div>
            </div>

            <div id="cost-display" class="hidden"></div>
        </div>
    </div>

    <script>
        const app = {
            currentText: '',
            isPlaying: false,
            utterance: null,
            readerSentenceSpans: [],
            readerActiveIndex: -1,
            readStartOffset: 0,
            provider: 'local',
            cloudAudioInterval: null,

            init() {
                this.loadVoices();
                this.setupEventListeners();
                console.log('[APP] Voice Reader initialized');
            },

            setupEventListeners() {
                document.getElementById('use-text-btn').addEventListener('click', () => this.loadText());
                document.getElementById('play-btn').addEventListener('click', () => this.togglePlay());
                document.getElementById('skip-back').addEventListener('click', () => this.skip(-10));
                document.getElementById('skip-forward').addEventListener('click', () => this.skip(10));
                document.getElementById('provider').addEventListener('change', (e) => {
                    this.provider = e.target.value;
                    this.updateProviderUI();
                });
                document.getElementById('speed').addEventListener('input', (e) => {
                    document.getElementById('speed-value').textContent = e.target.value + 'x';
                });
                document.getElementById('pitch').addEventListener('input', (e) => {
                    document.getElementById('pitch-value').textContent = e.target.value;
                });
            },

            updateProviderUI() {
                const localSettings = document.getElementById('local-settings');
                localSettings.style.display = this.provider === 'local' ? 'block' : 'none';
            },

            async loadVoices() {
                const voiceSelect = document.getElementById('voice');
                const voices = speechSynthesis.getVoices();
                
                if (voices.length === 0) {
                    setTimeout(() => this.loadVoices(), 100);
                    return;
                }

                voiceSelect.innerHTML = '<option value="">Testing voices...</option>';
                
                // Test voices for boundary support (like v4.0)
                const boundaryCapableVoices = [];
                const englishVoices = voices.filter(v => v.lang.startsWith('en'));
                
                console.log('[VOICE TEST] Testing', englishVoices.length, 'English voices for boundary support');
                
                for (let i = 0; i < Math.min(englishVoices.length, 10); i++) {
                    const voice = englishVoices[i];
                    const isCapable = await this.testVoiceBoundary(voice);
                    if (isCapable) {
                        boundaryCapableVoices.push(voice);
                        console.log('[VOICE TEST] ✓', voice.name, '- Boundary capable');
                    } else {
                        console.log('[VOICE TEST] ✗', voice.name, '- No boundary support');
                    }
                }
                
                // If no voices support boundaries, use all English voices
                const voicesToShow = boundaryCapableVoices.length > 0 ? boundaryCapableVoices : englishVoices;
                
                voiceSelect.innerHTML = '';
                voicesToShow.forEach((voice) => {
                    const index = voices.indexOf(voice);
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    voiceSelect.appendChild(option);
                });
                
                console.log('[VOICE TEST] Found', voicesToShow.length, 'usable voices');
            },
            
            testVoiceBoundary(voice) {
                return new Promise((resolve) => {
                    const testUtterance = new SpeechSynthesisUtterance(' ');
                    testUtterance.voice = voice;
                    testUtterance.volume = 0;
                    
                    let boundaryFired = false;
                    
                    testUtterance.onboundary = () => {
                        boundaryFired = true;
                    };
                    
                    testUtterance.onend = () => {
                        resolve(boundaryFired);
                    };
                    
                    testUtterance.onerror = () => {
                        resolve(false);
                    };
                    
                    setTimeout(() => {
                        speechSynthesis.cancel();
                        resolve(boundaryFired);
                    }, 500);
                    
                    speechSynthesis.speak(testUtterance);
                });
            },

            loadText() {
                const text = document.getElementById('text').value.trim();
                if (!text) {
                    alert('Please enter some text');
                    return;
                }

                this.currentText = text;
                this.readStartOffset = 0;
                this.prepareReaderText();
                document.getElementById('player-card').style.display = 'block';
                this.updateStatus('Text loaded - Ready to play');
            },

            prepareReaderText() {
                const readerContent = document.getElementById('reader-content');
                readerContent.innerHTML = '';
                this.readerSentenceSpans = [];
                this.readerActiveIndex = -1;

                const text = this.currentText || '';

                // Split text into sentences
                // Match sentences ending with . ! ? followed by space or end of string
                const sentenceRegex = /[^.!?]+[.!?]+(?:\s|$)/g;
                const sentences = text.match(sentenceRegex) || [text];

                console.log('[SENTENCE PARSING] Found', sentences.length, 'sentences');

                let currentPosition = 0;
                let pEl = document.createElement('p');
                let sentencesInParagraph = 0;

                sentences.forEach((sentence, index) => {
                    // Find actual position in original text
                    const sentenceStart = text.indexOf(sentence, currentPosition);

                    // Check if this sentence starts a new paragraph (preceded by \n\n)
                    if (sentenceStart > 0) {
                        const textBefore = text.substring(currentPosition, sentenceStart);
                        if (textBefore.includes('\n\n')) {
                            // Flush current paragraph
                            if (sentencesInParagraph > 0) {
                                readerContent.appendChild(pEl);
                                pEl = document.createElement('p');
                                sentencesInParagraph = 0;
                            }
                        }
                    }

                    // Create sentence span
                    const span = document.createElement('span');
                    span.textContent = sentence;
                    span.classList.add('reader-sentence');
                    span.dataset.start = String(sentenceStart >= 0 ? sentenceStart : currentPosition);

                    // Click handler to jump to sentence
                    span.addEventListener('click', () => {
                        const start = parseInt(span.dataset.start, 10) || 0;
                        this.readStartOffset = start;
                        this.stop();
                        setTimeout(() => this.play(), 100);
                    });

                    pEl.appendChild(span);

                    // Add space between sentences (except last one)
                    if (index < sentences.length - 1) {
                        pEl.appendChild(document.createTextNode(' '));
                    }

                    this.readerSentenceSpans.push(span);
                    sentencesInParagraph++;

                    // Update position
                    currentPosition = sentenceStart >= 0 ? sentenceStart + sentence.length : currentPosition + sentence.length;
                });

                // Flush final paragraph
                if (sentencesInParagraph > 0) {
                    readerContent.appendChild(pEl);
                }

                console.log('[SENTENCE PARSING] Created', this.readerSentenceSpans.length, 'sentence spans');
            },

            togglePlay() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            },

            async play() {
                if (this.provider === 'local') {
                    this.playLocal();
                } else if (this.provider === 'openai' || this.provider === 'elevenlabs') {
                    await this.playCloud();
                }
            },

            playLocal() {
                const voices = speechSynthesis.getVoices();
                const voiceIndex = parseInt(document.getElementById('voice').value) || 0;
                const voice = voices[voiceIndex];

                const text = this.currentText.slice(this.readStartOffset);
                if (!text) return;

                this.utterance = new SpeechSynthesisUtterance(text);
                this.utterance.voice = voice;
                this.utterance.rate = parseFloat(document.getElementById('speed').value);
                this.utterance.pitch = parseFloat(document.getElementById('pitch').value);

                this.utterance.onboundary = (e) => {
                    if (e.name === 'word') {
                        const charIndex = this.readStartOffset + e.charIndex;
                        this.highlightSentenceAt(charIndex);
                    }
                };

                this.utterance.onend = () => {
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.clearHighlight();
                    this.updateStatus('Finished');
                };

                speechSynthesis.speak(this.utterance);
                this.isPlaying = true;
                this.updatePlayButton();
                this.updateStatus('Playing... (Sentence-level highlighting)');
            },

            async playCloud() {
                const text = this.currentText;
                const provider = this.provider;

                this.updateStatus(`Generating audio with ${provider}...`);

                try {
                    const response = await fetch('/.netlify/functions/tts-proxy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            providerId: provider,
                            text: text,
                            voice: 'alloy'
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        const audioBlob = this.base64ToBlob(data.audio, 'audio/mpeg');
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audio = new Audio(audioUrl);

                        // Set up sentence highlighting based on estimated timing
                        audio.addEventListener('loadedmetadata', () => {
                            const duration = audio.duration;
                            const totalSentences = this.readerSentenceSpans.length;

                            if (totalSentences > 0 && duration > 0) {
                                const timePerSentence = duration / totalSentences;
                                console.log('[CLOUD TTS] Duration:', duration.toFixed(2), 's | Sentences:', totalSentences, '| Time per sentence:', timePerSentence.toFixed(2), 's');

                                let lastHighlightedSentence = -1;

                                // Clear any existing interval
                                if (this.cloudAudioInterval) {
                                    clearInterval(this.cloudAudioInterval);
                                }

                                // Update highlight every 100ms
                                this.cloudAudioInterval = setInterval(() => {
                                    if (audio.paused || audio.ended) {
                                        clearInterval(this.cloudAudioInterval);
                                        this.cloudAudioInterval = null;
                                        return;
                                    }

                                    const currentSentence = Math.min(
                                        Math.floor(audio.currentTime / timePerSentence),
                                        totalSentences - 1
                                    );

                                    // Only update if sentence changed
                                    if (currentSentence !== lastHighlightedSentence) {
                                        this.highlightSentenceByIndex(currentSentence);
                                        lastHighlightedSentence = currentSentence;
                                    }
                                }, 100);
                            }
                        });

                        audio.play();
                        this.isPlaying = true;
                        this.updatePlayButton();
                        this.updateStatus(`Playing... (Estimated timing for ${provider})`);

                        audio.onended = () => {
                            this.isPlaying = false;
                            this.updatePlayButton();
                            this.clearHighlight();
                            this.updateStatus('Finished');
                            URL.revokeObjectURL(audioUrl);

                            if (this.cloudAudioInterval) {
                                clearInterval(this.cloudAudioInterval);
                                this.cloudAudioInterval = null;
                            }
                        };
                    } else {
                        this.updateStatus(`Error: ${data.error}`);
                    }
                } catch (error) {
                    this.updateStatus(`Network error: ${error.message}`);
                }
            },

            pause() {
                speechSynthesis.pause();
                this.isPlaying = false;
                this.updatePlayButton();
                this.updateStatus('Paused');
            },

            stop() {
                speechSynthesis.cancel();
                this.isPlaying = false;
                this.updatePlayButton();
                this.clearHighlight();

                // Clear cloud audio interval if exists
                if (this.cloudAudioInterval) {
                    clearInterval(this.cloudAudioInterval);
                    this.cloudAudioInterval = null;
                }
            },

            skip(percent) {
                const text = this.currentText;
                const skipAmount = Math.floor(text.length * (percent / 100));
                this.readStartOffset = Math.max(0, Math.min(text.length, this.readStartOffset + skipAmount));
                
                if (this.isPlaying) {
                    this.stop();
                    setTimeout(() => this.play(), 100);
                }
            },

            highlightSentenceAt(charIndex) {
                this.clearHighlight();

                for (let i = 0; i < this.readerSentenceSpans.length; i++) {
                    const span = this.readerSentenceSpans[i];
                    const start = parseInt(span.dataset.start, 10);
                    const end = start + span.textContent.length;

                    if (charIndex >= start && charIndex < end) {
                        span.classList.add('highlight');
                        this.readerActiveIndex = i;
                        this.scrollSentenceIntoView(span);
                        break;
                    }
                }
            },

            highlightSentenceByIndex(index) {
                this.clearHighlight();

                if (index >= 0 && index < this.readerSentenceSpans.length) {
                    const span = this.readerSentenceSpans[index];
                    span.classList.add('highlight');
                    this.readerActiveIndex = index;
                    this.scrollSentenceIntoView(span);
                }
            },

            scrollSentenceIntoView(span) {
                const readerDisplay = document.querySelector('.reader-display');
                const spanTop = span.offsetTop;
                const spanHeight = span.offsetHeight;
                const displayHeight = readerDisplay.clientHeight;

                // Center the sentence in the visible area
                const scrollTo = spanTop - (displayHeight / 2) + (spanHeight / 2);

                readerDisplay.scrollTo({
                    top: Math.max(0, scrollTo),
                    behavior: 'smooth'
                });
            },

            clearHighlight() {
                this.readerSentenceSpans.forEach(span => span.classList.remove('highlight'));
                this.readerActiveIndex = -1;
            },

            updatePlayButton() {
                const btn = document.getElementById('play-btn');
                btn.textContent = this.isPlaying ? '⏸' : '▶';
            },

            updateStatus(message) {
                document.getElementById('status').textContent = message;
            },

            base64ToBlob(base64, mimeType) {
                const byteCharacters = atob(base64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                return new Blob([byteArray], { type: mimeType });
            }
        };

        // Initialize when voices are loaded
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => app.loadVoices();
        }

        // Start app
        app.init();
    </script>
</body>
</html>
