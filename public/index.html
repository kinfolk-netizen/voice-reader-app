<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witness Reader — listen, note, edit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #1f2937 0%, #020617 45%, #000 100%);
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 32px 16px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.12), transparent 55%) #020617;
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
            padding: 28px 26px 26px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            border-radius: 999px;
            background: linear-gradient(to right, rgba(96, 165, 250, 0.2), rgba(129, 140, 248, 0.2));
            border: 1px solid rgba(129, 140, 248, 0.6);
            color: #c7d2fe;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #4ade80;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .header h1 {
            font-size: 2.4em;
            margin-bottom: 6px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95em;
            color: #9ca3af;
        }

        .card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #60a5fa;
        }

        label {
            display: block;
            font-size: 0.9em;
            color: #9ca3af;
            margin-bottom: 8px;
            font-weight: 500;
        }

        select, textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.3), rgba(59, 130, 246, 0.3));
            border: 1px solid rgba(96, 165, 250, 0.5);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.5), rgba(59, 130, 246, 0.5));
            transform: scale(1.05);
        }

        .control-btn.primary {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        #status {
            text-align: center;
            font-size: 0.9em;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 999px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 8px;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            transition: width 0.1s linear;
        }

        .reader-display {
            background: radial-gradient(circle at top, rgba(15, 23, 42, 0.95), #020617);
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            padding: 18px;
            max-height: 450px;
            overflow-y: auto;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
            margin-top: 20px;
        }

        .reader-content {
            font-size: 1.05em;
            line-height: 1.8;
            color: #d1d5db;
        }

        .reader-content p {
            margin-bottom: 1em;
        }

        .reader-sentence {
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline;
            padding: 2px 0;
        }

        .reader-sentence:hover {
            background: rgba(96, 165, 250, 0.1);
            border-radius: 4px;
        }

        .reader-sentence.highlight {
            background: linear-gradient(120deg, rgba(96, 165, 250, 0.25) 0%, rgba(59, 130, 246, 0.2) 100%);
            padding: 4px 6px;
            border-radius: 6px;
            box-shadow: 0 0 16px rgba(96, 165, 250, 0.3);
            transition: all 0.3s ease;
        }

        .reader-display::-webkit-scrollbar {
            width: 8px;
        }

        .reader-display::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5);
            border-radius: 999px;
        }

        .reader-display::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.4);
            border-radius: 999px;
        }

        .writer-desk {
            margin-top: 16px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding-top: 14px;
        }

        .writer-toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .writer-toolbar button {
            padding: 8px 14px;
            font-size: 13px;
            margin-right: 0;
        }

        .note-passage {
            background: rgba(96, 165, 250, 0.1);
            border-left: 3px solid #60a5fa;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.9em;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-style: italic;
        }

        #note-input {
            width: 100%;
            min-height: 70px;
            padding: 10px;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            color: #e5e7eb;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 8px;
            resize: vertical;
        }

        .note-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .note-item:hover { border-color: rgba(96, 165, 250, 0.5); }
        .note-item .np { font-size: 0.82em; color: #94a3b8; font-style: italic; margin-bottom: 4px; }
        .note-item .nt { font-size: 0.9em; color: #e5e7eb; }
        .note-item .nd { font-size: 0.75em; color: #64748b; margin-top: 4px; }

        .mix-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            color: #9ca3af;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .mix-toggle input { width: auto; margin: 0; }

        .memo-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        #memo-btn.recording {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            animation: pulse-dot 1.2s ease-in-out infinite;
        }

        #memo-status { font-size: 0.82em; color: #94a3b8; }

        .memo-play {
            margin-top: 6px;
            padding: 6px 14px;
            font-size: 13px;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.4), rgba(59, 130, 246, 0.4));
            border: 1px solid rgba(96, 165, 250, 0.5);
        }

        /* ---------- Mobile pass ---------- */
        @media (max-width: 640px) {
            body { padding: 10px 6px; }
            .app-container { padding: 16px 12px; border-radius: 16px; }
            .header h1 { font-size: 1.6em; }
            select, textarea, input[type="text"], #note-input { font-size: 16px; } /* prevents iOS focus zoom */
            .writer-toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .writer-toolbar button { width: 100%; padding: 12px 8px; font-size: 14px; }
            .control-btn { width: 56px; height: 56px; }
            .control-btn.primary { width: 72px; height: 72px; }
            .reader-display { max-height: 46vh; padding: 12px; }
            .reader-content { font-size: 1em; line-height: 1.7; }
            button { padding: 12px 18px; }
            .note-item { padding: 12px; }
        }

        .status-msg {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 3px solid rgba(148, 163, 184, 0.3);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-msg.success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-msg.error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-msg.info {
            background: rgba(96, 165, 250, 0.1);
            color: #93c5fd;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .hidden {
            display: none;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding: 8px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 3px solid rgba(148, 163, 184, 0.3);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .slider-group {
            margin-bottom: 15px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        input[type="range"] {
            width: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="badge">
                <span class="badge-dot"></span>
                <span>Sentence-Level Highlighting</span>
            </div>
            <h1>🎙️ Witness Reader</h1>
            <p>Listen to your manuscript. Note what needs work. Never lose your place.</p>
        </header>

        <div class="card">
            <div class="card-title">Settings</div>
            
            <label for="provider">TTS Provider</label>
            <select id="provider">
                <option value="local">Local Browser (Free + Real-time Highlighting)</option>
                <option value="speechify">Speechify (Premium + Word-Sync Highlighting)</option>
                <option value="openai">OpenAI TTS (Premium + Estimated Highlighting)</option>
                <option value="elevenlabs">ElevenLabs (Premium + Estimated Highlighting)</option>
            </select>

            <div id="local-settings" class="provider-settings">
                <label for="local-voice">Voice</label>
                <select id="local-voice">
                    <option value="">Loading voices...</option>
                </select>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Speed</span>
                        <span id="speed-value">1.0x</span>
                    </div>
                    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Pitch</span>
                        <span id="pitch-value">1.0</span>
                    </div>
                    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>

            <div id="openai-settings" class="provider-settings hidden">
                <label for="openai-voice">OpenAI Voice</label>
                <select id="openai-voice">
                    <option value="alloy">alloy (Neutral, balanced)</option>
                </select>

                <label for="openai-model">Model</label>
                <select id="openai-model">
                    <option value="tts-1">tts-1 (Standard)</option>
                    <option value="tts-1-hd">tts-1-hd (High Definition)</option>
                </select>
            </div>

            <div id="elevenlabs-settings" class="provider-settings hidden">
                <label for="elevenlabs-voice">ElevenLabs Voice</label>
                <select id="elevenlabs-voice">
                    <option value="Rachel">Rachel (Female, calm narration)</option>
                </select>

                <label for="elevenlabs-model">Model</label>
                <select id="elevenlabs-model">
                    <option value="eleven_multilingual_v2">eleven_multilingual_v2</option>
                    <option value="eleven_monolingual_v1">eleven_monolingual_v1</option>
                </select>
            </div>

            <div id="speechify-settings" class="provider-settings hidden">
                <label for="speechify-voice">Speechify Voice</label>
                <select id="speechify-voice">
                    <option value="">Loading voices…</option>
                </select>

                <label for="speechify-model">Model</label>
                <select id="speechify-model">
                    <option value="simba-english">simba-english (most voices)</option>
                    <option value="simba-3.2">simba-3.2 (newest, select voices)</option>
                    <option value="simba-multilingual">simba-multilingual</option>
                </select>
            </div>

            <div id="provider-status" class="status-msg info">Loading voices...</div>
            <div id="active-voice" class="status-row hidden">
                <div class="spinner" id="voice-spinner"></div>
                <div id="active-voice-text">Preparing voice...</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Text Input</div>
            <textarea id="text" placeholder="Paste your text here...">Welcome to Voice Reader with sentence-level highlighting! This works with all TTS providers. Click any sentence to jump to that position. The current sentence is highlighted during playback.</textarea>
            <button id="use-text-btn">Load Text</button>
        </div>

        <div class="card" id="player-card" style="display: none;">
            <div class="card-title">Playback</div>

            <label class="mix-toggle">
                <input type="checkbox" id="mix-music">
                <span>&#127925; Mix with background music (keep YouTube/Spotify playing)</span>
            </label>

            <div id="status">Ready to play</div>

            <div class="controls">
                <button class="control-btn" id="skip-back" title="Skip Back">⏪</button>
                <button class="control-btn primary" id="play-btn" title="Play">▶</button>
                <button class="control-btn" id="skip-forward" title="Skip Forward">⏩</button>
            </div>

            <div class="progress-bar" id="progress-bar">
                <div id="progress-fill"></div>
            </div>

            <div class="reader-display">
                <div class="reader-content" id="reader-content"></div>
            </div>

            <div id="cost-display" class="hidden"></div>

            <div class="writer-desk" id="writer-desk">
                <div class="writer-toolbar">
                    <button id="note-btn" title="Pause and note this passage (N)">&#128221; Note</button>
                    <button id="copy-btn" title="Copy current passage (C)">&#10697; Copy passage</button>
                    <button id="resume-pos-btn" class="hidden" title="Resume where you left off">&#9193; Resume position</button>
                    <button id="export-notes-btn" title="Download notes as Markdown">&#8595; Export notes</button>
                </div>
                <div id="note-editor" class="hidden">
                    <div id="note-passage" class="note-passage"></div>
                    <textarea id="note-input" placeholder="Type your edit note, or record it below..."></textarea>
                    <div class="memo-row">
                        <button id="memo-btn" type="button">&#127897; Record voice memo</button>
                        <span id="memo-status"></span>
                    </div>
                    <button id="note-save">Save note</button>
                    <button id="note-cancel">Cancel</button>
                </div>
                <div id="notes-list"></div>
            </div>
        </div>
    </div>

    <script>
        const app = {
            currentText: '',
            isPlaying: false,
            utterance: null,
            readerSentenceSpans: [],
            readerActiveIndex: -1,
            readStartOffset: 0,
            provider: 'local',
            cloudAudioInterval: null,
            voiceCache: {
                local: [],
                openai: [],
                elevenlabs: [],
                speechify: []
            },
            voiceSelections: {
                local: '',
                openai: 'alloy',
                elevenlabs: 'Rachel',
                speechify: 'john-rhys-davies'
            },
            providerModels: {
                openai: 'tts-1',
                elevenlabs: 'eleven_multilingual_v2',
                speechify: 'simba-english'
            },
            cloudEngine: null,
            sharedAudio: null,
            wakeLock: null,
            currentCharIndex: 0,
            notes: [],
            _posSaveAt: 0,
            isVoiceReady: false,

            loadStaticVoices() {
                // Static voice lists for providers whose voices don't require an API call.
                // (Fixes broken init: this function was referenced but missing.)
                this.voiceCache.openai = [
                    { value: 'alloy', label: 'Alloy (Neutral, balanced)' },
                    { value: 'echo', label: 'Echo (Male, warm)' },
                    { value: 'fable', label: 'Fable (Expressive)' },
                    { value: 'onyx', label: 'Onyx (Male, deep)' },
                    { value: 'nova', label: 'Nova (Female, bright)' },
                    { value: 'shimmer', label: 'Shimmer (Female, soft)' }
                ];
            },

            init() {
                this.loadStaticVoices();
                this.initMixPreference();
                this.setupEventListeners();
                this.updateProviderUI();
                this.updatePlayButton();
                this.loadLocalVoices();
                console.log('[APP] Voice Reader initialized');
            },

            setupEventListeners() {
                document.getElementById('use-text-btn').addEventListener('click', () => this.loadText());
                document.getElementById('play-btn').addEventListener('click', () => this.togglePlay());
                document.getElementById('skip-back').addEventListener('click', () => this.skip(-10));
                document.getElementById('skip-forward').addEventListener('click', () => this.skip(10));
                document.getElementById('provider').addEventListener('change',async (e) => {
                    this.provider = e.target.value;
              await this.updateProviderUI();
                    this.updateActiveVoiceLabel();
                });
                document.getElementById('speed').addEventListener('input', (e) => {
                    document.getElementById('speed-value').textContent = e.target.value + 'x';
                });
                document.getElementById('pitch').addEventListener('input', (e) => {
                    document.getElementById('pitch-value').textContent = e.target.value;
                });

                // Voice selection handlers
                document.getElementById('local-voice').addEventListener('change', (e) => {
                    this.voiceSelections.local = e.target.value;
                    this.finishVoiceLoading('local');
                });

                document.getElementById('openai-voice').addEventListener('change', (e) => {
                    this.voiceSelections.openai = e.target.value;
                });

                document.getElementById('elevenlabs-voice').addEventListener('change', (e) => {
                    this.voiceSelections.elevenlabs = e.target.value;
                });

                document.getElementById('openai-model').addEventListener('change', (e) => {
                    this.providerModels.openai = e.target.value;
                });

                document.getElementById('elevenlabs-model').addEventListener('change', (e) => {
                    this.providerModels.elevenlabs = e.target.value;
                });

                document.getElementById('speechify-voice').addEventListener('change', (e) => {
                    this.voiceSelections.speechify = e.target.value;
                    // Auto-pick a model the chosen voice actually supports
                    const v = (this.voiceCache.speechify || []).find(x => x.value === e.target.value);
                    if (v && Array.isArray(v.models) && v.models.length && !v.models.includes(this.providerModels.speechify)) {
                        this.providerModels.speechify = v.models.includes('simba-english') ? 'simba-english' : v.models[0];
                        const sel = document.getElementById('speechify-model');
                        if (sel) sel.value = this.providerModels.speechify;
                    }
                    this.updateActiveVoiceLabel();
                });

                document.getElementById('speechify-model').addEventListener('change', (e) => {
                    this.providerModels.speechify = e.target.value;
                });

                // Writer Desk
                document.getElementById('note-btn').addEventListener('click', () => this.openNoteEditor());
                document.getElementById('copy-btn').addEventListener('click', () => this.copyCurrentPassage());
                document.getElementById('export-notes-btn').addEventListener('click', () => this.exportNotes());
                document.getElementById('mix-music').addEventListener('change', () => this.applyMixPreference());
                document.getElementById('memo-btn').addEventListener('click', () => this.toggleMemoRecording());
                document.getElementById('note-save').addEventListener('click', () => this.saveNote());
                document.getElementById('note-cancel').addEventListener('click', () => this.closeNoteEditor());
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); this.openNoteEditor(); }
                    if (e.key === 'c' || e.key === 'C') { e.preventDefault(); this.copyCurrentPassage(); }
                    if (e.key === ' ') { e.preventDefault(); this.togglePlay(); }
                });
            },

            async updateProviderUI() {
                document.querySelectorAll('.provider-settings').forEach(el => el.classList.add('hidden'));

                if (this.provider === 'local') {
                    document.getElementById('local-settings').classList.remove('hidden');
                } else if (this.provider === 'openai') {
                    document.getElementById('openai-settings').classList.remove('hidden');
                    this.populateVoiceOptions('openai');
                    this.finishVoiceLoading('openai');
                } else if (this.provider === 'elevenlabs') {
                    document.getElementById('elevenlabs-settings').classList.remove('hidden');
    
    if (!this.voiceCache.elevenlabs || this.voiceCache.elevenlabs.length === 0) {
        this.updateStatus('🔄 Loading ElevenLabs voices...');
        const loaded = await this.loadDynamicVoices('elevenlabs');
        
        if (loaded) {
            this.updateStatus(`✅ Loaded ${this.voiceCache.elevenlabs.length} ElevenLabs voices`);
        } else {
            this.updateStatus('⚠️ Could not load ElevenLabs voices');
            return;
        }
    } else {
        console.log(`✓ Using cached ${this.voiceCache.elevenlabs.length} voices`);
    }
    
    this.populateVoiceOptions('elevenlabs');

                } else if (this.provider === 'speechify') {
                    document.getElementById('speechify-settings').classList.remove('hidden');

                    if (!this.voiceCache.speechify || this.voiceCache.speechify.length === 0) {
                        this.updateStatus('🔄 Loading Speechify voices...');

            // Load voices dynamically from backend API endpoint
async loadDynamicVoices(providerId) {
    try {
        console.log(`🔄 Loading ${providerId} voices from API...`);
        
        const response = await fetch(`/.netlify/functions/get-voices?providerId=${providerId}`);
        
        if (!response.ok) {
            console.error(`❌ Failed to load voices: HTTP ${response.status}`);
            this.updateStatus(`Error loading ${providerId} voices`);
            return false;
        }
        
        const data = await response.json();
        
        if (data.voices && data.voices.length > 0) {
            this.voiceCache[providerId] = data.voices.map(v => ({
                value: v.id,
                label: v.label,
                models: v.models || [],
                description: v.description || '',
                category: v.category || 'general'
            }));
            
            console.log(`✅ Successfully loaded ${data.voices.length} ${providerId} voices`);
            return true;
        }
        
        console.warn(`⚠️ No voices returned for ${providerId}`);
        this.updateStatus(`No voices available for ${providerId}`);
        return false;
        
    } catch (error) {
        console.error(`❌ Error loading ${providerId} voices:`, error);
        this.updateStatus(`Error: ${error.message}`);
        return false;
    }
},

            async requestWakeLock() {

                        this.wakeLock.addEventListener('release', () => { this.wakeLock = null; });

            // ---- IndexedDB store for voice memos (localStorage is too small for audio) ----
            memoDB() {
                if (this._memoDBPromise) return this._memoDBPromise;
                this._memoDBPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open('vr-voice-memos', 1);
                    req.onupgradeneeded = () => req.result.createObjectStore('memos');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                return this._memoDBPromise;
            },

            async memoPut(id, blob) {
                const db = await this.memoDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('memos', 'readwrite');
                    tx.objectStore('memos').put(blob, id);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            },

            async memoGet(id) {
                const db = await this.memoDB();
                return new Promise((resolve, reject) => {
                    const req = db.transaction('memos').objectStore('memos').get(id);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            },

            // ---- Voice memo recording ----
            async toggleMemoRecording() {
                if (this.memoRecorder && this.memoRecorder.state === 'recording') {
                    this.memoRecorder.stop();
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
                        : MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
                        : '';
                    const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
                    this.memoRecorder = rec;
                    this.memoChunksRec = [];
                    rec.ondataavailable = (e) => { if (e.data.size) this.memoChunksRec.push(e.data); };
                    rec.onstop = () => {
                        stream.getTracks().forEach(tr => tr.stop());
                        this.memoBlob = new Blob(this.memoChunksRec, { type: rec.mimeType || 'audio/webm' });
                        this.memoRecorder = null;
                        const btn = document.getElementById('memo-btn');
                        btn.textContent = '\uD83C\uDF99 Re-record';
                        btn.classList.remove('recording');
                        document.getElementById('memo-status').textContent =
                            'Voice memo recorded (' + Math.round(this.memoBlob.size / 1024) + ' KB) - will save with this note';
                    };
                    rec.start();
                    const btn = document.getElementById('memo-btn');
                    btn.textContent = '\u23F9 Stop recording';
                    btn.classList.add('recording');
                    document.getElementById('memo-status').textContent = 'Recording... tap Stop when done';
                } catch (e) {
                    document.getElementById('memo-status').textContent =
                        'Microphone unavailable: ' + e.message;
                }
            },

            async playMemo(memoId, btnEl) {
                const blob = await this.memoGet(memoId);
                if (!blob) { this.updateStatus('Voice memo not found on this device'); return; }
                if (this.isPlaying) this.pause();
                const url = URL.createObjectURL(blob);
                const a = new Audio(url);
                if (btnEl) btnEl.textContent = '\u25A0';
                a.onended = () => { URL.revokeObjectURL(url); if (btnEl) btnEl.textContent = '\u25B6'; };
                a.play();
            },

            textKey() {
                let h = 5381;
                const s = this.currentText || '';
                for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
                return 'vr-' + (h >>> 0).toString(36) + '-' + s.length;
            },

            savePosition(charIndex) {
                const now = Date.now();
                if (now - this._posSaveAt < 2000) return;
                this._posSaveAt = now;
                try { localStorage.setItem(this.textKey() + '-pos', String(charIndex)); } catch (e) {}
            },

            loadSavedPosition() {
                try { return parseInt(localStorage.getItem(this.textKey() + '-pos') || '0', 10); } catch (e) { return 0; }
            },

            currentPassage() {
                const idx = this.findSentenceIndexAt(this.currentCharIndex);
                const span = this.readerSentenceSpans[idx];
                return span ? { text: span.textContent.trim(), offset: parseInt(span.dataset.start, 10) || 0 } : null;
            },

            findSentenceIndexAt(charIndex) {
                let best = 0;
                this.readerSentenceSpans.forEach((span, i) => {
                    const s = parseInt(span.dataset.start, 10) || 0;
                    if (s <= charIndex) best = i;
                });
                return best;
            },

            loadNotes() {
                try { this.notes = JSON.parse(localStorage.getItem(this.textKey() + '-notes') || '[]'); }
                catch (e) { this.notes = []; }
                this.renderNotes();
            },

            persistNotes() {
                try { localStorage.setItem(this.textKey() + '-notes', JSON.stringify(this.notes)); } catch (e) {}
            },

            openNoteEditor() {
                if (this.isPlaying) this.pause();
                const p = this.currentPassage();
                if (!p) { this.updateStatus('Load text first'); return; }
                this._notePassage = p;
                this.memoBlob = null;
                const memoBtn = document.getElementById('memo-btn');
                memoBtn.textContent = '\uD83C\uDF99 Record voice memo';
                memoBtn.classList.remove('recording');
                document.getElementById('memo-status').textContent = '';
                document.getElementById('note-passage').textContent = '\u201C' + p.text + '\u201D';
                document.getElementById('note-editor').classList.remove('hidden');
                document.getElementById('note-input').focus();
            },

            async saveNote() {
                const input = document.getElementById('note-input');
                const noteText = input.value.trim();
                const hasMemo = !!this.memoBlob;
                if ((!noteText && !hasMemo) || !this._notePassage) { this.closeNoteEditor(); return; }
                const pct = this.currentText.length ? Math.round((this._notePassage.offset / this.currentText.length) * 100) : 0;
                const note = {
                    ts: new Date().toISOString(),
                    offset: this._notePassage.offset,
                    pct: pct,
                    passage: this._notePassage.text,
                    note: noteText
                };
                if (hasMemo) {
                    note.memoId = 'memo-' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
                    try { await this.memoPut(note.memoId, this.memoBlob); }
                    catch (e) { note.memoId = null; this.updateStatus('Voice memo could not be saved: ' + e.message); }
                    this.memoBlob = null;
                }
                this.notes.push(note);
                this.persistNotes();
                this.renderNotes();
                input.value = '';
                this.closeNoteEditor();
                this.updateStatus('Note saved - press play to resume where you left off');
            },

            closeNoteEditor() {
                document.getElementById('note-editor').classList.add('hidden');
            },

            renderNotes() {
                const list = document.getElementById('notes-list');
                if (!list) return;
                list.innerHTML = '';
                this.notes.slice().reverse().forEach((n) => {
                    const div = document.createElement('div');
                    div.className = 'note-item';
                    div.innerHTML = '<div class="np"></div><div class="nt"></div><div class="nd"></div>';
                    div.querySelector('.np').textContent = '\u201C' + n.passage.slice(0, 120) + (n.passage.length > 120 ? '\u2026' : '') + '\u201D';
                    div.querySelector('.nt').textContent = n.note || (n.memoId ? '(voice memo)' : '');
                    div.querySelector('.nd').textContent = n.pct + '% - ' + new Date(n.ts).toLocaleString();
                    if (n.memoId) {
                        const playBtn = document.createElement('button');
                        playBtn.className = 'memo-play';
                        playBtn.textContent = '\u25B6';
                        playBtn.title = 'Play voice memo';
                        playBtn.addEventListener('click', (e) => { e.stopPropagation(); this.playMemo(n.memoId, playBtn); });
                        div.appendChild(playBtn);
                    }
                    div.addEventListener('click', () => this.jumpToOffset(n.offset));
                    list.appendChild(div);
                });
            },

            jumpToOffset(offset) {
                this.readStartOffset = offset;
                const idx = this.findSentenceIndexAt(offset);
                this.highlightSentenceByIndex(idx);
                const span = this.readerSentenceSpans[idx];
                if (span) span.scrollIntoView({ behavior: 'smooth', block: 'center' });
                this.updateStatus('Jumped to ' + (this.currentText.length ? Math.round((offset / this.currentText.length) * 100) : 0) + '% - press play to listen from here');
                if (this.isPlaying) { this.stop(); setTimeout(() => this.play(), 150); }
            },

            copyCurrentPassage() {
                const p = this.currentPassage();
                if (!p) { this.updateStatus('Nothing to copy yet'); return; }
                const doCopy = navigator.clipboard && navigator.clipboard.writeText
                    ? navigator.clipboard.writeText(p.text)
                    : Promise.reject(new Error('clipboard unavailable'));
                doCopy.then(
                    () => this.updateStatus('Passage copied to clipboard'),
                    () => {
                        const ta = document.createElement('textarea');
                        ta.value = p.text;
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy'); this.updateStatus('Passage copied to clipboard'); }
                        catch (e) { this.updateStatus('Copy failed - select the text manually'); }
                        document.body.removeChild(ta);
                    }
                );
            },

            exportNotes() {
                if (!this.notes.length) { this.updateStatus('No notes to export yet'); return; }
                const d = new Date();
                const stamp = d.toISOString().slice(0, 10);
                let md = '# Listening Notes - ' + stamp + '\n\n';
                md += '_' + this.notes.length + ' notes exported from Voice Reader_\n\n---\n\n';
                this.notes.forEach((n, i) => {
                    md += '## ' + (i + 1) + '. At ' + n.pct + '%\n\n';
                    md += '> ' + n.passage + '\n\n';
                    if (n.note) md += n.note + '\n\n';
                    if (n.memoId) md += '_[voice memo recorded ' + new Date(n.ts).toLocaleString() + ' - play it in the app]_\n\n';
                });
                const blob = new Blob([md], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = stamp + '_Listening_Notes.md';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                this.updateStatus('Notes exported as Markdown');
            },

            offerResume() {
                const saved = this.loadSavedPosition();
                const btn = document.getElementById('resume-pos-btn');
                if (saved > 50 && saved < this.currentText.length - 50) {
                    const pct = Math.round((saved / this.currentText.length) * 100);
                    btn.textContent = 'Resume at ' + pct + '%';
                    btn.classList.remove('hidden');
                    btn.onclick = () => { this.jumpToOffset(saved); btn.classList.add('hidden'); };
                } else {
                    btn.classList.add('hidden');
                }
            },

            loadText() {
                const text = document.getElementById('text').value.trim();
                if (!text) {
                    alert('Please enter some text');
                    return;
                }

                this.currentText = text;
                this.readStartOffset = 0;
                this.prepareReaderText();
                document.getElementById('player-card').style.display = 'block';
                this.loadNotes();
                this.offerResume();
                this.updateStatus('Text loaded - Ready to play');
            },

            prepareReaderText() {
                const readerContent = document.getElementById('reader-content');
                readerContent.innerHTML = '';
                this.readerSentenceSpans = [];
                this.readerActiveIndex = -1;

                const text = this.currentText || '';

                // Split text into sentences
                // Match sentences ending with . ! ? followed by space or end of string
                const sentenceRegex = /[^.!?]+[.!?]+(?:\s|$)/g;
                const sentences = text.match(sentenceRegex) || [text];

                console.log('[SENTENCE PARSING] Found', sentences.length, 'sentences');

                let currentPosition = 0;
                let pEl = document.createElement('p');
                let sentencesInParagraph = 0;

                sentences.forEach((sentence, index) => {
                    // Find actual position in original text
                    const sentenceStart = text.indexOf(sentence, currentPosition);

                    // Check if this sentence starts a new paragraph (preceded by \n\n)
                    if (sentenceStart > 0) {
                        const textBefore = text.substring(currentPosition, sentenceStart);
                        if (textBefore.includes('\n\n')) {
                            // Flush current paragraph
                            if (sentencesInParagraph > 0) {
                                readerContent.appendChild(pEl);
                                pEl = document.createElement('p');
                                sentencesInParagraph = 0;
                            }
                        }
                    }

                    // Create sentence span
                    const span = document.createElement('span');
                    span.textContent = sentence;
                    span.classList.add('reader-sentence');
                    span.dataset.start = String(sentenceStart >= 0 ? sentenceStart : currentPosition);

                    // Click handler to jump to sentence
                    span.addEventListener('click', () => {
                        const start = parseInt(span.dataset.start, 10) || 0;
                        this.readStartOffset = start;
                        this.stop();
                        setTimeout(() => this.play(), 100);
                    });

                    pEl.appendChild(span);

                    // Add space between sentences (except last one)
                    if (index < sentences.length - 1) {
                        pEl.appendChild(document.createTextNode(' '));
                    }

                    this.readerSentenceSpans.push(span);
                    sentencesInParagraph++;

                    // Update position
                    currentPosition = sentenceStart >= 0 ? sentenceStart + sentence.length : currentPosition + sentence.length;
                });

                // Flush final paragraph
                if (sentencesInParagraph > 0) {
                    readerContent.appendChild(pEl);
                }

                console.log('[SENTENCE PARSING] Created', this.readerSentenceSpans.length, 'sentence spans');
            },

            togglePlay() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            },

            async play() {
                if (!this.isVoiceReady) {
                    this.updateStatus('Voice is loading...');
                    return;
                }
                if (this.provider === 'local') {
                    this.playLocal();
                } else if (this.provider === 'openai' || this.provider === 'elevenlabs' || this.provider === 'speechify') {
                    await this.playCloud();
                }
            },

            playLocal() {
                if (!this.currentText) {
                    this.updateStatus('Please load text first');
                    return;
                }

                const voices = speechSynthesis.getVoices();
                const voiceIndex = parseInt(document.getElementById('local-voice').value, 10) || 0;
                const voice = voices[voiceIndex] || voices[0];

                const text = this.currentText.slice(this.readStartOffset);
                if (!text.trim()) {
                    this.updateStatus('No text to read');
                    return;
                }

                this.stop();
                speechSynthesis.cancel();

                const startOffset = this.readStartOffset;
                this.utterance = new SpeechSynthesisUtterance(text);
                this.utterance.voice = voice;
                this.utterance.rate = parseFloat(document.getElementById('speed').value);
                this.utterance.pitch = parseFloat(document.getElementById('pitch').value);

                this.utterance.onstart = () => {
                    this.highlightSentenceAt(startOffset);
                };

                this.utterance.onboundary = (e) => {
                    if (e.name === 'word') {
                        const charIndex = startOffset + e.charIndex;
                        this.highlightSentenceAt(charIndex);
                    }
                };

                this.utterance.onend = () => {
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.clearHighlight();
                    this.updateStatus('Finished');
                };

                this.utterance.onerror = (e) => {
                    console.error('Speech error:', e);
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.updateStatus('Playback error');
                };

                setTimeout(() => {
                    console.log('[PLAYBACK] Starting with voice:', voice?.name);
                    speechSynthesis.speak(this.utterance);
                    this.isPlaying = true;
                    this.updatePlayButton();
                    this.updateStatus('Playing... (Sentence-level highlighting)');
                }, 50);
            },

            buildCloudChunks(text, limit = 3800) {
                // Split on paragraph boundaries and pack up to `limit` chars per chunk.
                // Long paragraphs fall back to sentence splits. Offsets are global.
                const chunks = [];
                const parts = text.split(/\n\s*\n/);
                let searchFrom = 0;
                const paraInfos = [];
                for (const p of parts) {
                    if (!p.trim().length) continue;
                    const idx = text.indexOf(p, searchFrom);
                    searchFrom = idx + p.length;
                    paraInfos.push({ text: p, start: idx });
                }
                let cur = null;
                const pushCur = () => { if (cur) { chunks.push(cur); cur = null; } };
                for (const p of paraInfos) {
                    let pieces = [{ text: p.text, start: p.start }];
                    if (p.text.length > limit) {
                        pieces = [];
                        const sre = /[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g;
                        let m;
                        while ((m = sre.exec(p.text)) !== null) {
                            pieces.push({ text: m[0], start: p.start + m.index });
                        }
                    }
                    for (const piece of pieces) {
                        const pieceEnd = piece.start + piece.text.length;
                        if (cur && (pieceEnd - cur.start) > limit) pushCur();
                        if (!cur) cur = { start: piece.start, end: pieceEnd };
                        cur.end = pieceEnd;
                    }
                }
                pushCur();
                return chunks.map(c => ({ start: c.start, end: c.end, text: text.slice(c.start, c.end) }));
            },

            flattenSpeechMarks(sm) {
                // Speechify speech marks arrive as { chunks: [...] } (word marks with
                // start_time in ms and start char offsets) or as a flat list.
                if (!sm) return [];
                const out = [];
                const walk = (node) => {
                    if (!node) return;
                    if (Array.isArray(node)) { node.forEach(walk); return; }
                    const st = (node.start_time !== undefined) ? node.start_time : node.startTime;
                    if (typeof node.start === 'number' && typeof st === 'number') {
                        out.push({ start: node.start, startTime: st });
                    }
                    if (node.chunks) walk(node.chunks);
                };
                walk(sm);
                return out.sort((a, b) => a.startTime - b.startTime);
            },

            async fetchCloudChunk(provider, chunk) {
                const response = await fetch('/.netlify/functions/tts-proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        providerId: provider,
                        text: chunk.text,
                        voice: this.voiceSelections[provider],
                        options: { model: this.providerModels[provider] }
                    })
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'TTS request failed');
                return data;
            },

            stopCloud() {
                if (this.cloudEngine) {
                    this.cloudEngine.stopped = true;
                    if (this.cloudEngine.interval) clearInterval(this.cloudEngine.interval);
                    if (this.cloudEngine.audio) { try { this.cloudEngine.audio.pause(); } catch (e) {} }
                    this.cloudEngine = null;
                }
                if (this.cloudAudioInterval) { clearInterval(this.cloudAudioInterval); this.cloudAudioInterval = null; }
            },

            async playCloud() {
                // Resume if the user paused mid-listen
                if (this.cloudEngine && this.cloudEngine.audio && this.cloudEngine.pausedByUser) {
                    this.cloudEngine.pausedByUser = false;
                    this.cloudEngine.audio.play();
                    this.isPlaying = true;
                    this.updatePlayButton();
                    this.updateStatus('Playing...');
                    return;
                }

                const provider = this.provider;
                const fullText = this.currentText || '';
                if (!fullText.trim()) { this.updateStatus('Please load text first'); return; }
                const startOffset = Math.min(this.readStartOffset || 0, Math.max(fullText.length - 1, 0));

                this.stopCloud();
                this.markVoiceLoading(provider);
                this.updateStatus(`Generating audio with ${provider}...`);

                let chunks = this.buildCloudChunks(fullText).filter(c => c.end > startOffset);
                if (chunks.length && chunks[0].start < startOffset) {
                    chunks[0] = { start: startOffset, end: chunks[0].end, text: fullText.slice(startOffset, chunks[0].end) };
                }
                console.log('[CLOUD TTS] Queued', chunks.length, 'chunks | provider:', provider);

                const engine = { provider, chunks, idx: 0, audio: null, cache: {}, interval: null, pausedByUser: false, stopped: false };
                this.cloudEngine = engine;

                const prefetch = (i) => {
                    if (i >= chunks.length || engine.cache[i]) return;
                    engine.cache[i] = this.fetchCloudChunk(provider, chunks[i]);
                    engine.cache[i].catch(() => { delete engine.cache[i]; });
                };

                const playChunk = async (i) => {
                    if (engine.stopped) return;
                    if (i >= chunks.length) {
                        this.isPlaying = false;
                        this.updatePlayButton();
                        this.clearHighlight();
                        this.updateStatus('Finished');
                        this.cloudEngine = null;
                        return;
                    }
                    engine.idx = i;
                    try {
                        prefetch(i);
                        const data = await engine.cache[i];
                        if (engine.stopped) return;
                        prefetch(i + 1); // fetch the next chunk while this one plays

                        const chunk = chunks[i];
                        const audioBlob = this.base64ToBlob(data.audio, 'audio/mpeg');
                        const audioUrl = URL.createObjectURL(audioBlob);
                        // Reuse ONE audio element across chunks (iOS Safari only lets
                        // gesture-unlocked elements keep playing when src changes).
                        if (!this.sharedAudio) this.sharedAudio = new Audio();
                        const audio = this.sharedAudio;
                        audio.onended = null;
                        audio.onerror = null;
                        audio.src = audioUrl;
                        engine.audio = audio;
                        audio.playbackRate = parseFloat(document.getElementById('speed').value) || 1;

                        const marks = this.flattenSpeechMarks(data.speechMarks);
                        if (marks.length) {
                            audio.addEventListener('timeupdate', () => {
                                if (engine.stopped) return;
                                const tMs = audio.currentTime * 1000;
                                let lo = 0, hi = marks.length - 1, best = 0;
                                while (lo <= hi) {
                                    const mid = (lo + hi) >> 1;
                                    if (marks[mid].startTime <= tMs) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
                                }
                                this.highlightSentenceAt(chunk.start + marks[best].start);
                            });
                        } else {
                            audio.addEventListener('loadedmetadata', () => {
                                const duration = audio.duration;
                                if (!duration) return;
                                if (engine.interval) clearInterval(engine.interval);
                                engine.interval = setInterval(() => {
                                    if (engine.stopped || audio.paused || audio.ended) return;
                                    const frac = Math.min(audio.currentTime / duration, 0.999);
                                    const charIndex = chunk.start + Math.floor((chunk.end - chunk.start) * frac);
                                    this.highlightSentenceAt(charIndex);
                                }, 200);
                            });
                        }

                        audio.onended = () => {
                            URL.revokeObjectURL(audioUrl);
                            if (engine.interval) { clearInterval(engine.interval); engine.interval = null; }
                            if (!engine.stopped && !engine.pausedByUser) playChunk(i + 1);
                        };
                        audio.onerror = () => this.updateStatus('Audio playback error');

                        await audio.play();
                        this.requestWakeLock();
                        this.finishVoiceLoading(provider);
                        this.isPlaying = true;
                        this.updatePlayButton();
                        const mode = marks.length ? 'word-sync' : 'estimated';
                        this.updateStatus(`Playing ${i + 1}/${chunks.length} (${mode} highlighting)`);
                    } catch (error) {
                        console.error('[CLOUD TTS] Chunk error:', error);
                        this.updateStatus(`Error: ${error.message}`);
                        this.finishVoiceLoading(provider);
                        this.isPlaying = false;
                        this.updatePlayButton();
                    }
                };

                playChunk(0);
            },

            pause() {
                if (this.cloudEngine && this.cloudEngine.audio) {
                    this.cloudEngine.pausedByUser = true;
                    this.cloudEngine.audio.pause();
                } else {
                    speechSynthesis.pause();
                }
                this.isPlaying = false;
                this.updatePlayButton();
                this.updateStatus('Paused');
            },

            stop() {
                speechSynthesis.cancel();
                this.stopCloud();
                this.isPlaying = false;
                this.updatePlayButton();
                this.clearHighlight();
            },

            skip(percent) {
                const text = this.currentText;
                const skipAmount = Math.floor(text.length * (percent / 100));
                this.readStartOffset = Math.max(0, Math.min(text.length, this.readStartOffset + skipAmount));
                
                if (this.isPlaying) {
                    this.stop();
                    setTimeout(() => this.play(), 100);
                }
            },

            highlightSentenceAt(charIndex) {
                this.currentCharIndex = charIndex;
                this.savePosition(charIndex);
                this.clearHighlight();

                for (let i = 0; i < this.readerSentenceSpans.length; i++) {
                    const span = this.readerSentenceSpans[i];
                    const start = parseInt(span.dataset.start, 10);
                    const end = start + span.textContent.length;

                    if (charIndex >= start && charIndex < end) {
                        span.classList.add('highlight');
                        this.readerActiveIndex = i;
                        this.scrollSentenceIntoView(span);
                        break;
                    }
                }
            },

            highlightSentenceByIndex(index) {
                this.clearHighlight();

                if (index >= 0 && index < this.readerSentenceSpans.length) {
                    const span = this.readerSentenceSpans[index];
                    span.classList.add('highlight');
                    this.readerActiveIndex = index;
                    this.scrollSentenceIntoView(span);
                }
            },

            scrollSentenceIntoView(span) {
                const readerDisplay = document.querySelector('.reader-display');
                const spanTop = span.offsetTop;
                const spanHeight = span.offsetHeight;
                const displayHeight = readerDisplay.clientHeight;
                const maxScroll = readerDisplay.scrollHeight - displayHeight;

                const scrollTo = Math.min(
                    Math.max(0, spanTop - (displayHeight / 2) + (spanHeight / 2)),
                    maxScroll
                );

                readerDisplay.scrollTo({
                    top: scrollTo,
                    behavior: 'smooth'
                });
            },

            clearHighlight() {
                this.readerSentenceSpans.forEach(span => span.classList.remove('highlight'));
                this.readerActiveIndex = -1;
            },

            updatePlayButton() {
                const btn = document.getElementById('play-btn');
                btn.textContent = this.isPlaying ? '⏸' : '▶';
                btn.disabled = !this.isVoiceReady;
            },

            updateStatus(message) {
                document.getElementById('status').textContent = message;
            },

            updateProviderStatus(message) {
                const statusEl = document.getElementById('provider-status');
                if (statusEl) statusEl.textContent = message;
            },

            base64ToBlob(base64, mimeType) {
                const byteCharacters = atob(base64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                return new Blob([byteArray], { type: mimeType });
            }
        };

        // Initialize when voices are loaded
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => app.loadLocalVoices();
        }

        // Start app
        app.init();
    </script>
</body>
</html>
